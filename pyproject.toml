[project]
name = "earnticker"
version = "1.0.0"
description = "Always-on-top floating panel that shows how much you earn, second by second."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
